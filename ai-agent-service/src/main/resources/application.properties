spring.application.name=ai-agent-service
server.port=8090
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.mcp.server.name=ebank-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.annotation-scanner.enabled=true
app.notifications.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
app.notifications.telegram.chat-id=${TELEGRAM_CHAT_ID:}
app.notifications.discord.webhook-url=${DISCORD_WEBHOOK_URL:}
management.endpoints.web.exposure.include=health,info
